<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfaf8">
  <meta name="description" content="MioLang — приложение для изучения корейского языка и подготовки к TOPIK.">
  <title>MioLang - изучай языки</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" data-route="home" aria-label="MioLang — на главную">MioLang</a>

      <button class="icon-button menu-toggle" id="menuToggle" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobileMenu">
        <span></span><span></span><span></span>
      </button>

      <nav class="desktop-nav" aria-label="Основная навигация">
        <button class="nav-link" type="button" data-route="home">Мой дневник</button>
        <button class="nav-link" type="button" data-route="dictionary">Практика</button>
        <button class="nav-link" type="button" data-route="examSetup">Экзамен</button>
      </nav>

      <div class="header-tools">
        <button class="language-pill" type="button" data-action="language-info" aria-label="Выбранный язык: корейский">
          <span aria-hidden="true"></span><span>Корейский</span><span class="chevron" aria-hidden="true">↓</span>
        </button>
        <button class="avatar-button" type="button" data-route="profile" aria-label="Открыть профиль">А</button>
      </div>
    </div>
    <nav class="mobile-menu" id="mobileMenu" aria-label="Мобильная навигация" hidden>
      <button type="button" data-route="home">Мой дневник</button>
      <button type="button" data-route="dictionary">Словарь</button>
      <button type="button" data-route="flashcards">Флеш-карточки</button>
      <button type="button" data-route="quiz">Тест по словам</button>
      <button type="button" data-route="examSetup">Экзамен TOPIK</button>
      <button type="button" data-route="profile">Профиль и статистика</button>
    </nav>
  </header>

  <main id="appMain" class="app-main" tabindex="-1"></main>

  <footer class="site-footer"><span>MioLang</span></footer>

  <nav class="bottom-nav" aria-label="Быстрая навигация">
    <button type="button" data-route="home" class="bottom-nav-item" aria-label="Мой дневник"><span aria-hidden="true">⌂</span><small>Главная</small></button>
    <button type="button" data-route="dictionary" class="bottom-nav-item" aria-label="Практика"><span aria-hidden="true">🕮</span><small>Практика</small></button>
    <button type="button" data-route="examSetup" class="bottom-nav-item" aria-label="Экзамен"><span aria-hidden="true">✓</span><small>Экзамен</small></button>
    <button type="button" data-route="profile" class="bottom-nav-item" aria-label="Профиль"><span aria-hidden="true">○</span><small>Профиль</small></button>
  </nav>

  <div id="modalLayer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
